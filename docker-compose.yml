services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phishshield
      POSTGRES_PASSWORD: phishshield
      POSTGRES_DB: phishshield
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishshield"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://phishshield:phishshield@db:5432/phishshield
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: http://localhost:8080
      SIMULATION_BASE_URL: http://localhost:8080
      ALLOWED_SIMULATION_DOMAINS: phishshield.local,localhost
      SEED_ON_STARTUP: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
